name: Sync fork with upstream

on:
  schedule:
    - cron: '0 12 * * 1' # every Monday 12:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sync fork main from upstream
        run: |
          set -euo pipefail
          echo "Syncing ${{ github.repository }} (main) from upstream (NousResearch/hermes-agent)..."
          gh repo sync ${{ github.repository }} -b main
          echo "Sync complete."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
